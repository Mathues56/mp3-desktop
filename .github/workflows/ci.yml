name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py mp3_desktop tests
      - run: ruff check app.py mp3_desktop tests
      - run: ruff format --check app.py mp3_desktop tests
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name MP3Desktop app.py
      - uses: actions/upload-artifact@v4
        with:
          name: MP3Desktop-windows-unvalidated
          path: dist/MP3Desktop.exe
