name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag semver já criada após validação manual do executável'
        required: true
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name MP3Desktop app.py
      - shell: pwsh
        run: (Get-FileHash dist/MP3Desktop.exe -Algorithm SHA256).Hash.ToLower() + '  MP3Desktop.exe' | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create '${{ inputs.tag }}' dist/MP3Desktop.exe dist/SHA256SUMS.txt --title '${{ inputs.tag }}' --notes-file CHANGELOG.md
